      <div class="c-body">
        <!--Main content-->
        <main class="c-main">
          <div class="container-fluid">
            <div class="fade-in">
              <div class="row">
                <div class="col-md-12">
                  <div class="card-status bg-status-ok" id="statusDiv" style="display: none;">
                    <span class="status-img bg-img bg-img-status-ok" id="imgStatusOk" style="display: none;"></span>
                    <span class="status-img bg-img bg-img-status-bad" id="imgStatusErr" style="display: none;"></span>
                    <span class="status-img bg-img bg-img-status-warn" id="imgStatusWarn" style="display: none;"></span>
                    <strong id="statusTextDiv" class="status-text"></strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="container-fluid">
            <div class="fade-in">
              <div class="row">
                <div class="col-md-12">
                  <div class="card">
                    <div class="card-header">
                      <strong>Firmware update</strong>
                    </div>
                    <div class="card-body">
                      <div class="form-horizontal">
                        <div class="form-group row">
                          <label class="col-md-4 col-form-label" for="curFwVersion">Current FW version:</label>
                          <div class="col-md-6 d-flex align-items-center" id="curFwVersion"></div>
                        </div>
                        <!--
                        <div class="form-group row">
                          <label class="col-md-4 col-form-label" for="updType">Update type:</label>
                          <div class="col-md-6">
                            <select class="form-control" id="updType" onchange="adminFwUpdate.updateTypeChanged();">
                              <option value="0">Sensor firmware</option>
                              <option value="1">Display firmware</option>
                            </select>
                          </div>
                        </div>
                        -->
                        <div class="form-group row">
                          <label class="col-md-4 col-form-label" for="fileInput">Select FW file(*.<span id="fwFileExt">enpir</span>):</label>
                          <div class="col-md-6">
                            <div class="input-group file-upload">
                              <input type="file" id="fileInputHolder" onchange="adminFwUpdate.openFile(event);" />
                              <div class="form-control" id="fileNameHolder">No file selected</div>
                              <span class="input-group-append">
                                <button id="fileButHolder" class="btn btn-primary">
                                  Browse
                                </button>
                              </span>
                            </div>
                          </div>
                        </div>
                        <div class="d-flex justify-content-center">
                          <div class="col-md-8 p-0 mb-3 mt-2">
                            <div class="progress" style="height: 20px;" id="progressBar">
                              <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBarLabel"></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="card-footer">
                      <div class="row">
                        <div class="col-md-4"></div>
                        <div class="col-md-6">
                          <button class="btn btn-primary btn-standart" onclick="adminFwUpdate.loadFile();" id="uploadBtn">Upload</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <!--Footer-->
        <footer class="c-footer">V<span id="fwVer"></span></footer>
