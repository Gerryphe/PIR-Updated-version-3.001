      <div class="c-body">
        <!--Main content-->
        <main class="c-main">
          <div class="container-fluid">
            <div class="fade-in">
              <div class="row">
                <div class="col-md-12">
                  <div class="card-status bg-status-ok" id="statusDiv" style="display: none;">
                    <span class="status-img bg-img bg-img-status-ok" id="imgStatusOk" style="display: none;"></span>
                    <span class="status-img bg-img bg-img-status-bad" id="imgStatusErr" style="display: none;"></span>
                    <span class="status-img bg-img bg-img-status-warn" id="imgStatusWarn" style="display: none;"></span>
                    <strong id="statusTextDiv" class="status-text"></strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="container-fluid">
            <div class="fade-in">
              <div class="row">
                <div class="col-md-12">
                  <div class="card">
                    <div class="card-header">
                      <strong>NTP Setup</strong>
                    </div>
                    <div class="card-body">
                      <div class="form-horizontal">
                        <div class="form-group row">
                          <label class="col-md-4 col-form-label" for="ntpMode">Time configuration:</label>
                          <div class="col-md-6">
                            <select class="form-control" id="ntpMode" onchange="servNtp.timeConfigChanged();">
                              <option value="0">NTP Server</option>
                              <option value="1">Manual</option>
                            </select>
                          </div>
                        </div>
                        <div id="ntpAutoRegionId">
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpServerAddr">Server IP/URL adress:</label>
                            <div class="col-md-6">
                              <input class="form-control" type="text" id="ntpServerAddr" value="" onKeyPress="if(((event.keyCode>=33)&&(event.keyCode<=126))) return true; else return false;" />
                            </div>
                          </div>
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpTimeZone">Time zone:</label>
                            <div class="col-md-6">
                              <input
                                class="form-control"
                                type="text"
                                id="ntpTimeZone"
                                value=""
                                onKeyPress="if(((event.keyCode>=48)&&(event.keyCode<=57))||(event.keyCode==58)||(event.keyCode==43)||(event.keyCode==45)) return true; else return false;"
                              />
                            </div>
                          </div>
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpSynchInterval">Synch interval (min):</label>
                            <div class="col-md-6">
                              <input class="form-control" type="text" id="ntpSynchInterval" value="" onKeyPress="if(((event.keyCode>=48)&&(event.keyCode<=57))||(event.keyCode==46)) return true; else return false;" />
                            </div>
                          </div>
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpRetryInterval">Retry interval (min):</label>
                            <div class="col-md-6">
                              <input class="form-control" type="text" id="ntpRetryInterval" value="" onKeyPress="if(((event.keyCode>=48)&&(event.keyCode<=57))||(event.keyCode==46)) return true; else return false;" />
                            </div>
                          </div>
                        </div>
                        <div id="ntpManRegionId">
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpManTime">Set date/time:</label>
                            <div class="col-md-6">
                              <input class="form-control" type="datetime-local" id="ntpManTime" onkeydown="return false" />
                            </div>
                          </div>
                        </div>
                        <!--
                        <div class="form-group row">
                          <label for="ntpRtcAddr" class="col-md-4 col-form-label">RTC I2C address (HEX):</label>
                          <div class="col-md-6">
                            <input
                              class="form-control"
                              type="text"
                              id="ntpRtcAddr"
                              onKeyPress="if(((event.keyCode>=48)&&(event.keyCode<=57)) || ((event.keyCode>=65)&&(event.keyCode<=70)) || ((event.keyCode>=97)&&(event.keyCode<=102))) return true; else return false;"
                            />
                          </div>
                        </div>
                        -->
                        <div class="form-group row">
                          <label class="col-md-4 col-form-label" for="ntpUptime">Uptime:</label>
                          <div class="col-md-6 d-flex align-items-center" id="ntpUptime">
                          </div>
                        </div>
                        <div class="form-group row">
                          <label class="col-md-4 col-form-label" for="ntpCurrTime">Current time:</label>
                          <div class="col-md-6 d-flex align-items-center" id="ntpCurrTime">
                          </div>
                        </div>
                        <div id="ntpStatusRegionId">
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpLastUpdated">Last updated:</label>
                            <div class="col-md-6 d-flex align-items-center" id="ntpLastUpdated">
                            </div>
                          </div>
                          <div class="form-group row">
                            <label class="col-md-4 col-form-label" for="ntpStatus">Status:</label>
                            <div class="col-md-6 d-flex align-items-center" id="ntpStatus">
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="card-footer">

                        <div class="col-md-6">
                          <button class="btn btn-primary btn-standart" onclick="servNtp.save();">
                            Save
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
